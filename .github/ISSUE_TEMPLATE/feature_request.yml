name: Feature request
description: Propose a focused improvement to Tavern or its Hermes integration.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest complete user experience.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Story experience
        - Characters and worldbooks
        - Models and voice
        - Hermes skills
        - Deployment and updater
        - Documentation
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and data impact
      description: Note any effect on existing worlds, user state, APIs, or updater behavior.
