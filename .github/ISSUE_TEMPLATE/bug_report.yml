name: Bug report
description: Report reproducible Tavern behavior that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include model keys, user data, private cards, conversations, or raw ClawChat databases.
  - type: input
    id: version
    attributes:
      label: Tavern version
      placeholder: v1.23.19
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Standalone
        - Hermes Agent
        - Hermes Agent with ClawChat Liveware
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove all credentials, user IDs, private URLs, and story content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I reproduced this on the latest release.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
